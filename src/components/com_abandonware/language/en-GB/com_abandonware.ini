; Strings the front end uses that were only defined in the administrator language file. Values
; copied unchanged from administrator/.../com_abandonware.ini. A public report opens a case and
; its JED ticket in the visitor's request (ReportService, CaseService::ensureTicket), and the
; ticket subject and body are stored - a missing key was saved into the ticket as the raw key.
; Keep both files in step when changing any of these.
; ---------------------------------------------------------------------------------------------
