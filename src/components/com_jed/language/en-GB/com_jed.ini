COM_JED_VEL_ABANDONEDREPORTS_OVERVIEW_DESCRIPTION="<p>We accept reports of abandoned Joomla! extensions. If you believe you have found an extension that has been abandoned or officialy stopped development, please complete the following form.</p><p>Note that we do not coordinate or publish every report we receive. </p><p>If you have any problems, please contact us.</p><p>Please provide as much information as you can. Incomplete or incorrect information may delay our investigation. When you are finished, submit your report using the button at the end of the form.</p><p style=\"color: #FF0000\">Information with a (*) is required.</p><p> Data collected under Joomla Privacy and cookie policy <a href=\"https://www.joomla.org/privacy-policy.html\">as shown</a>"
