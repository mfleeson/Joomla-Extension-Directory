; Privacy Suite (P1-18): the ticket system's determinations, rendered alongside the ones above.
COM_JED_PRIVACY_DETERMINATION_TICKETS="Support tickets: deleted on request, together with every message on them, including the JED team's replies. A ticket is correspondence with a person rather than a record about software and nothing is computed from it, so there is no reason to keep it once the person is erased. Tickets opened by somebody else keep their thread; only the person's name comes off the assignment and editing fields. Internal team notes on a case are never returned on an export."
COM_JED_PRIVACY_DETERMINATION_TICKET_MESSAGES="Ticket messages: the person's messages are deleted wherever they were written, including on other people's tickets. Messages marked internal are the team's notes about a case and are not returned on an export, because they can describe a third party's case."
COM_JED_PRIVACY_DETERMINATION_TICKET_INTERNAL_NOTES="The JED team's internal notes on tickets: the record of which team member wrote a note is removed on request; the note stays, because it is the team's record of a case. Never returned on an export, because a note can describe a third party's case."
COM_JED_PRIVACY_OUTOFSCOPE_TICKET_CONFIGURATION="The ticket categories, allocation groups and linked-item types are configuration maintained by the JED team. They record who set the site up, not who used it."

