; Privacy Suite (P1-18). The per-data-set determinations 8.12 asks for, rendered on the
; System -> Privacy -> Capabilities screen. Each states what the JED holds, what happens to it on
; an erasure request, and where a retention interest is claimed, what it is.
COM_JED_PRIVACY_DETERMINATION_EXTENSIONS="Extension listings: the listing itself is kept, because it describes a piece of software rather than a person. Removed on request are the owner reference and the developer's contact address and website. A listing whose owner withdraws is blocked as unowned, because nobody is then answerable for it, and it becomes available for adoption through the abandonware process."
COM_JED_PRIVACY_DETERMINATION_EXTENSIONS_HISTORY="Listing revisions: every earlier version of a listing carries the same owner reference and developer contact details as the live row, and is cleared in the same way. A revision history is where an erased address would otherwise survive unnoticed."
COM_JED_PRIVACY_DETERMINATION_MAINTAINERS="Maintainer roles and invitations (retired in 4.1.0, replaced by organisations): deleted outright on request, in both directions - the roles the person held, and the record that they invited somebody else."
COM_JED_PRIVACY_DETERMINATION_MEDIA="Screenshots and files attached to listings: the uploads are kept, because they depict software; the record of which account uploaded them is removed."
COM_JED_PRIVACY_DETERMINATION_REVIEWS="Reviews: by default the review text and rating are kept and the author reference and the address it was submitted from are removed, because an extension's public score is computed from these ratings and deleting one silently changes a number other people relied on. The JED team can configure deletion instead, in which case every affected extension's score is recalculated. Replies the person wrote as a developer under other people's reviews are removed either way."
COM_JED_PRIVACY_DETERMINATION_FAVORITES="Bookmarked listings: deleted."
COM_JED_PRIVACY_DETERMINATION_IDENTITY_LINKS="Identity Portal link: the record tying the account to the person's Joomla Identity Portal identifier is deleted. The portal itself is where that identity is removed."
COM_JED_PRIVACY_DETERMINATION_IDENTITY_CLAIMS="Pending claims of an old account: deleted, whether the person is the one claiming or the one whose old account was claimed. Not returned on an export, the rows hold only a hash of a one time link."
COM_JED_PRIVACY_DETERMINATION_USER_ACCESS="Per-user privileges and bans: deleted, unless a ban is still in force. A ban that is still running is kept, because erasing it would not erase data so much as reverse a measure - and it ends by itself, at which point a later request removes the record too."
COM_JED_PRIVACY_DETERMINATION_REVIEW_BANS="Bans from reviewing a particular developer or category: kept, for the same reason as a ban that is still in force. These have no end date, so they are reviewed by hand rather than expiring."
COM_JED_PRIVACY_DETERMINATION_TRANSFERS="Ownership transfers: a transfer still under way is cancelled and both parties are told. Completed transfers are kept, because the record of who handed which listing to whom is the only trace of how ownership came to be where it is. The confirmation tokens are stored only as hashes and are destroyed when a transfer closes."
COM_JED_PRIVACY_DETERMINATION_TRANSFER_LOOKUPS="Recipient lookups: deleted. This log records that an account searched for another person's email address, so it is not returned on an export - it is about the person searched for as much as the searcher."
COM_JED_PRIVACY_DETERMINATION_URL_CHECKS="URL checks run while filling in a listing form: the result is kept, because it is about a web address, and the record of which account triggered it is removed."
COM_JED_PRIVACY_DETERMINATION_QUEUE_JOBS="Background job records: the job is kept, the account that queued it is removed. Not returned on an export - the rows say nothing about a person beyond that they saved a listing."

COM_JED_PRIVACY_OUTOFSCOPE_CATEGORY_MAP="Listing-to-category assignments hold no personal data."
COM_JED_PRIVACY_OUTOFSCOPE_BLOCK_REASONS="The vocabulary of moderation reasons holds no personal data."
COM_JED_PRIVACY_OUTOFSCOPE_JOOMLA_VERSIONS="The list of Joomla versions holds no personal data."
COM_JED_PRIVACY_OUTOFSCOPE_LINKCHECKS="Link health records hold no personal data - a web address, when it was last reached, and what it answered."
COM_JED_PRIVACY_OUTOFSCOPE_SUSPECT_IP_RANGES="Suspect address ranges are ranges rather than addresses, are entered by the JED team, and only ever flag a submission for a human to look at. They never block anybody."
COM_JED_PRIVACY_OUTOFSCOPE_HIT_LOG="Page and download hits are recorded without a user reference and with the visitor's address stored only as a salted hash, so an individual visit cannot be traced back to a person. Raw records are deleted after 30 days."
COM_JED_PRIVACY_OUTOFSCOPE_HIT_STATS="Daily view and download totals per extension are counts, with nothing in them that refers to a person."

COM_JED_TRANSFER_CANCELLED_PRIVACY_REMOVAL="One of the parties asked for their data to be erased."

