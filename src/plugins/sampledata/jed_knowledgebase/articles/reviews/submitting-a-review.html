<p>Submitting your review of an extension is helpful to other Joomla users who are considering different extensions. At the bottom of an extension's description, under the "Reviews" tab, click on the "Write a Review" button.</p>
<p><img style="display: block; margin-left: auto; margin-right: auto;" src="https://extensions.joomla.org/images/knowledgebase/submittingreviews/review1.jpg" alt="review1" /></p>
<p>After that, complete the review form and submit the review.</p>
